name: Release binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Build release archives
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p dist
          built_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ldflags="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.builtAt=${built_at}"

          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="bluff_${VERSION}_${os}_${arch}"
            mkdir -p "dist/${name}"
            CGO_ENABLED=0 GOOS="${os}" GOARCH="${arch}" go build -trimpath -ldflags "${ldflags}" -o "dist/${name}/bluff" ./cmd/bluff
            cp README.md "dist/${name}/"
            tar -C dist -czf "dist/${name}.tar.gz" "${name}"
            rm -rf "dist/${name}"
          done

          for arch in amd64 arm64; do
            name="bluff_${VERSION}_windows_${arch}"
            mkdir -p "dist/${name}"
            CGO_ENABLED=0 GOOS=windows GOARCH="${arch}" go build -trimpath -ldflags "${ldflags}" -o "dist/${name}/bluff.exe" ./cmd/bluff
            cp README.md "dist/${name}/"
            (cd dist && zip -qr "${name}.zip" "${name}")
            rm -rf "dist/${name}"
          done

          (cd dist && sha256sum ./*.tar.gz ./*.zip > checksums.txt)

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --verify-tag
